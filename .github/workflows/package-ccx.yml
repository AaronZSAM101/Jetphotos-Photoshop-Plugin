name: Package CCX

on:
  push:
    branches:
      - main
      - master
    paths:
      - manifest.json
  workflow_dispatch:

jobs:
  package:
    name: Build packages
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Read manifest version
        id: manifest
        run: |
          VERSION=$(node -p "require('./manifest.json').version")
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "version_changed=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          BEFORE_VERSION=""
          if git show "${{ github.event.before }}:manifest.json" > /tmp/previous-manifest.json 2>/dev/null; then
            BEFORE_VERSION=$(node -p "require('/tmp/previous-manifest.json').version")
          fi

          if [ "$BEFORE_VERSION" != "$VERSION" ]; then
            echo "version_changed=true" >> "$GITHUB_OUTPUT"
          else
            echo "version_changed=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Skip unchanged manifest version
        if: steps.manifest.outputs.version_changed != 'true'
        run: echo "manifest.json changed, but the version field did not change. Skipping package and release."

      - name: Create CCX archive
        if: steps.manifest.outputs.version_changed == 'true'
        run: |
          rm -f com.aviation-photo-viewer.photo-check-tools_PS.ccx
          zip -r com.aviation-photo-viewer.photo-check-tools_PS.ccx \
            icons \
            index.html \
            main.js \
            manifest.json \
            README.md \
            styles.css

      - name: Create manual install archive
        if: steps.manifest.outputs.version_changed == 'true'
        env:
          VERSION: ${{ steps.manifest.outputs.version }}
        run: |
          ZIP_FILE="com.aviation-photo-viewer.photo-check-tools_${VERSION}.zip"
          rm -f "$ZIP_FILE"
          zip -r "$ZIP_FILE" \
            icons \
            index.html \
            main.js \
            manifest.json \
            README.md \
            styles.css

      - name: Upload CCX artifact
        if: steps.manifest.outputs.version_changed == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: com.aviation-photo-viewer.photo-check-tools_PS.ccx
          path: com.aviation-photo-viewer.photo-check-tools_PS.ccx
          if-no-files-found: error

      - name: Upload manual install artifact
        if: steps.manifest.outputs.version_changed == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: com.aviation-photo-viewer.photo-check-tools_${{ steps.manifest.outputs.version }}.zip
          path: com.aviation-photo-viewer.photo-check-tools_${{ steps.manifest.outputs.version }}.zip
          if-no-files-found: error

      - name: Publish GitHub Release
        if: steps.manifest.outputs.version_changed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.manifest.outputs.version }}
          CCX_FILE: com.aviation-photo-viewer.photo-check-tools_PS.ccx
          ZIP_FILE: com.aviation-photo-viewer.photo-check-tools_${{ steps.manifest.outputs.version }}.zip
        run: |
          if gh release view "$VERSION" >/dev/null 2>&1; then
            gh release edit "$VERSION" --title "$VERSION"
          else
            gh release create "$VERSION" --target "$GITHUB_SHA" --title "$VERSION" --notes "Release $VERSION"
          fi

          gh release upload "$VERSION" "$CCX_FILE" --clobber
          gh release upload "$VERSION" "$ZIP_FILE" --clobber
